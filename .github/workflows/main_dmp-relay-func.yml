# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy dotnet core app to Azure Function App - dmp-relay-func

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: './FunctionAppNet8' # set this to the path to your web app project, defaults to the repository root
  DOTNET_VERSION: '8.0.x' # set this to the dotnet version to use

jobs:
  build-and-deploy:
    runs-on: windows-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: Setup DotNet ${{ env.DOTNET_VERSION }} Environment
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 'Resolve Project Dependencies Using Dotnet'
        shell: pwsh
        run: |
          pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
          dotnet build --configuration Release --output ./output
          popd
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8EF69DC7F94A4C519D4CF5F734335722 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_422E6E902DB344C2851A66839781C1DB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_09E7B423DF0546DD9F7FBBF98EBB4428 }}

      - name: 'Run Azure Functions Action'
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: 'dmp-relay-func'
          slot-name: 'Production'
          package: '${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/output'
      
      - name: 'Configure App Settings'
        shell: pwsh
        run: |
            $resourceGroup = "DataMigrateProRG"  # Make sure this matches your actual resource group name
            az functionapp config appsettings set --name dmp-relay-func --resource-group $resourceGroup --settings "FUNCTIONS_WORKER_RUNTIME=dotnet-isolated" "RelayNamespace=${{ secrets.RELAY_NAMESPACE }}" "HybridConnectionName=${{ secrets.HYBRID_CONNECTION_NAME }}" "RelaySasKeyName=${{ secrets.RELAY_SAS_KEY_NAME }}" "RelaySasKey=${{ secrets.RELAY_SAS_KEY }}"